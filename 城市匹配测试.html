<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f1">
<title>你适合在哪座城市生活？· 城市气质测试</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --ink:#1c1c1a; --ink-2:#3d3d3a; --muted:#78776f; --faint:#a3a29a;
    --bg:#f7f5f1; --card:#fff; --accent:#1f4b3f; --accent-2:#2f6b59;
    --accent-soft:#e9f0eb; --line:rgba(28,28,26,.09); --line-2:rgba(28,28,26,.16);
  }
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
    font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;
    min-height:100dvh; display:flex; justify-content:center;
  }
  #app{width:100%; max-width:520px; padding:0 22px calc(28px + env(safe-area-inset-bottom)); display:flex; flex-direction:column}
  .screen{display:none; flex:1; flex-direction:column}
  .screen.on{display:flex}

  /* ---------- 开始页 ---------- */
  .brand{display:flex; align-items:center; gap:8px; padding:26px 0 0; font-size:12px; letter-spacing:.14em; color:var(--faint)}
  .brand i{display:inline-block; width:16px; height:1.5px; background:var(--accent); opacity:.55}
  .hero{padding:52px 0 0}
  .hero h1{font-size:34px; line-height:1.28; font-weight:600; letter-spacing:-.02em; margin:0 0 18px}
  .hero p{font-size:15px; color:var(--muted); margin:0; max-width:19em}
  .sky{margin:34px 0 14px}
  .meta{display:flex; gap:14px; font-size:12.5px; color:var(--faint); flex-wrap:wrap}
  .meta span{display:flex; align-items:center; gap:5px}
  .meta b{width:3px; height:3px; border-radius:50%; background:var(--faint); display:inline-block}
  .cta{
    margin-top:auto; padding-top:34px;
  }
  button.primary{
    width:100%; border:0; border-radius:14px; background:var(--accent); color:#fff;
    font-size:16.5px; font-weight:500; padding:17px; font-family:inherit; cursor:pointer;
    letter-spacing:.02em; transition:transform .12s ease, background .2s;
  }
  button.primary:active{transform:scale(.985); background:var(--accent-2)}
  .foot{font-size:11.5px; color:var(--faint); line-height:1.7; margin-top:16px; text-align:center}

  /* ---------- 答题页 ---------- */
  .qtop{display:flex; align-items:center; justify-content:space-between; padding:26px 0 0; font-size:12.5px; color:var(--faint)}
  .qtop .num b{color:var(--accent); font-weight:600; font-size:14px}
  .back{border:0; background:none; color:var(--faint); font-size:13px; font-family:inherit; cursor:pointer; padding:6px 0}
  .bar{height:2px; background:var(--line); border-radius:2px; margin:12px 0 0; overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:var(--accent); border-radius:2px; transition:width .32s cubic-bezier(.4,0,.2,1)}
  .qbody{padding:40px 0 0}
  .qbody h2{font-size:22px; line-height:1.5; font-weight:600; letter-spacing:-.01em; margin:0 0 30px}
  .opts{display:flex; flex-direction:column; gap:10px}
  .opt{
    display:flex; align-items:flex-start; gap:13px; text-align:left; width:100%;
    background:var(--card); border:1px solid var(--line); border-radius:13px;
    padding:15px 16px; font-size:15px; line-height:1.5; color:var(--ink-2);
    font-family:inherit; cursor:pointer; transition:border-color .16s, background .16s, transform .1s;
  }
  .opt:active{transform:scale(.99)}
  .opt .k{
    flex:0 0 21px; height:21px; border-radius:50%; border:1px solid var(--line-2);
    display:flex; align-items:center; justify-content:center;
    font-size:11.5px; color:var(--faint); margin-top:1px; transition:all .16s;
  }
  .opt.sel{border-color:var(--accent); background:var(--accent-soft)}
  .opt.sel .k{background:var(--accent); border-color:var(--accent); color:#fff}

  /* ---------- 结果页 ---------- */
  .rhead{padding:36px 0 0}
  .rlabel{font-size:11.5px; letter-spacing:.16em; color:var(--faint); margin-bottom:14px}
  .rscore{display:flex; align-items:baseline; gap:8px; margin-bottom:6px}
  .rscore b{font-size:52px; font-weight:600; letter-spacing:-.03em; line-height:1; color:var(--accent)}
  .rscore span{font-size:14px; color:var(--muted)}
  .rcity{font-size:31px; font-weight:600; letter-spacing:-.02em; margin:8px 0 6px}
  .rtag{font-size:15px; color:var(--muted)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:18px}
  .card h3{font-size:13px; letter-spacing:.1em; color:var(--faint); font-weight:500; margin:0 0 14px}
  .why{display:flex; flex-direction:column; gap:13px}
  .why div{font-size:14.5px; line-height:1.62; color:var(--ink-2); padding-left:13px; position:relative}
  .why div:before{content:""; position:absolute; left:0; top:.62em; width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:.4}
  .radar{display:flex; justify-content:center; padding:4px 0 0}
  .alt{display:flex; gap:10px; margin-top:2px}
  .alt .item{flex:1; min-width:0; background:var(--bg); border-radius:12px; padding:13px 14px}
  .alt .item b{display:block; font-size:16px; font-weight:600; margin-bottom:3px}
  .alt .item span{font-size:12px; color:var(--muted); line-height:1.5; display:block}
  .alt .item em{font-style:normal; font-size:11.5px; color:var(--accent); display:block; margin-top:6px}
  .warn{background:#fdf6ec; border:1px solid #f0e0c4; border-radius:16px; padding:20px; margin-top:18px}
  .warn h3{color:#9a7434}
  .warn p{font-size:14.5px; line-height:1.62; color:#6b5636; margin:0}
  .acts{counter-reset:a; display:flex; flex-direction:column; gap:12px}
  .acts div{font-size:14.5px; line-height:1.6; color:var(--ink-2); padding-left:26px; position:relative}
  .acts div:before{
    counter-increment:a; content:counter(a);
    position:absolute; left:0; top:.18em; width:17px; height:17px; border-radius:50%;
    background:var(--accent-soft); color:var(--accent);
    font-size:10.5px; display:flex; align-items:center; justify-content:center; font-weight:600;
  }
  .disc{font-size:11.5px; color:var(--faint); line-height:1.75; margin-top:22px}
  .ractions{display:flex; gap:10px; margin-top:22px}
  .ractions button{
    flex:1; padding:14px; border-radius:12px; font-size:14.5px; font-family:inherit; cursor:pointer;
    border:1px solid var(--line-2); background:transparent; color:var(--ink-2);
  }
  .ractions button.solid{background:var(--accent); border-color:var(--accent); color:#fff}
  .fade{animation:fade .38s ease both}
  @keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  @media (max-width:360px){
    .hero h1{font-size:29px}
    .qbody h2{font-size:20px}
    .rcity{font-size:27px}
  }
</style>
</head>
<body>
<div id="app">

  <!-- 开始页 -->
  <section class="screen on" id="s-start">
    <div class="brand"><i></i>城市气质测试</div>

      <div class="opts" id="q-opts"></div>
    </div>
  </section>

  <!-- 结果页 -->
  <section class="screen" id="s-result"></section>

</div>

<script>

/* ========================= 引擎 ========================= */

const CITY_STATS = (() => {
  const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
  const dev = a => { const m = avg(a); return Math.sqrt(avg(a.map(x => (x - m) ** 2))) || 1; };
  const M = {}, S = {}, MIN = {}, MAX = {};
  DIMS.forEach(d => {
    const v = CITIES.map(c => c.v[d]);
    M[d] = avg(v); S[d] = dev(v);
    MIN[d] = Math.min.apply(null, v); MAX[d] = Math.max.apply(null, v);
  });
  return { M, S, MIN, MAX };
})();

const state = { i: 0, answers: new Array(QUESTIONS.length).fill(null) };

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  const el = $(id);
  el.classList.add('on');
  el.classList.remove('fade');
  void el.offsetWidth;
  el.classList.add('fade');
  window.scrollTo(0, 0);
}

$('q-total').textContent = QUESTIONS.length;

function renderQuestion(){
  const q = QUESTIONS[state.i];
  $('q-cur').textContent = state.i + 1;
  $('q-bar').style.width = ((state.i) / QUESTIONS.length * 100) + '%';
  $('q-title').textContent = q.t;
  const box = $('q-opts');
  box.innerHTML = '';
  q.options.forEach((o, idx) => {
    const b = document.createElement('button');
    b.className = 'opt' + (state.answers[state.i] === idx ? ' sel' : '');
    b.innerHTML = '<span class="k">' + 'ABCD'[idx] + '</span><span>' + o.t + '</span>';
    b.onclick = () => pick(idx);
    box.appendChild(b);
  });
  $('btn-back').style.visibility = state.i === 0 ? 'hidden' : 'visible';
}

function pick(idx){
  state.answers[state.i] = idx;
  document.querySelectorAll('.opt').forEach((el, i) => el.classList.toggle('sel', i === idx));
  setTimeout(() => {
    if (state.i < QUESTIONS.length - 1){ state.i++; renderQuestion(); }
    else { renderResult(); }
  }, 180);
}

$('btn-back').onclick = () => { if (state.i > 0){ state.i--; renderQuestion(); } };
$('btn-start').onclick = () => { state.i = 0; state.answers.fill(null); show('s-quiz'); renderQuestion(); };

function scoreUser(){
  const raw = {}, cnt = {};
  DIMS.forEach(d => { raw[d] = 0; cnt[d] = 0; });
  state.answers.forEach((ai, qi) => {
    if (ai === null) return;
    const s = QUESTIONS[qi].options[ai].s;
    for (const k in s){
      raw[k] += s[k];
      if (s[k] !== 0) cnt[k]++;
    }
  });
  const out = {};
  DIMS.forEach(d => {
    const mean = cnt[d] ? raw[d] / cnt[d] : 0;
    const p = clamp((mean + 2) / 4, 0, 1);
    out[d] = Math.round(CITY_STATS.MIN[d] + p * (CITY_STATS.MAX[d] - CITY_STATS.MIN[d]));
  });
  return out;
}

function matchScore(u, city){
  let sum = 0;
  DIMS.forEach(d => {
    const x = (u[d] - CITY_STATS.M[d]) / CITY_STATS.S[d];
    const y = (city.v[d] - CITY_STATS.M[d]) / CITY_STATS.S[d];
    sum += (x - y) * (x - y);
  });
  const dist = Math.sqrt(sum / DIMS.length);
  return clamp(Math.round(100 - dist * 40), 45, 96);
}

function radarSVG(user, city){
  const S = 300, C = 150, R = 104;
  const ang = i => (-90 + i * 60) * Math.PI / 180;
  const pt = (i, r) => [C + Math.cos(ang(i)) * r, C + Math.sin(ang(i)) * r];
  const poly = vals => DIMS.map((d, i) => pt(i, R * vals[d] / 100).join(',')).join(' ');

  let grid = '';
  [0.25, 0.5, 0.75, 1].forEach(k => {
    grid += '<polygon points="' + DIMS.map((d, i) => pt(i, R * k).join(',')).join(' ') +
      '" fill="none" stroke="rgba(28,28,26,.10)" stroke-width="1"/>';
  });
  let axes = '', labels = '';
  DIMS.forEach((d, i) => {
    const [x, y] = pt(i, R);
    axes += '<line x1="' + C + '" y1="' + C + '" x2="' + x + '" y2="' + y + '" stroke="rgba(28,28,26,.10)" stroke-width="1"/>';
    const [lx, ly] = pt(i, R + 21);
    const anchor = Math.abs(lx - C) < 6 ? 'middle' : (lx > C ? 'start' : 'end');
    labels += '<text x="' + lx + '" y="' + (ly + 4) + '" text-anchor="' + anchor +
      '" font-size="11.5" fill="#8b8a82">' + DIM_META[d].label + '</text>';
  });

  return '<svg viewBox="0 0 300 300" width="100%" style="max-width:300px" role="img" aria-label="六维匹配雷达图">' +
    grid + axes +
    '<polygon points="' + poly(city.v) + '" fill="none" stroke="#1f4b3f" stroke-width="1.2" stroke-dasharray="4 3" opacity=".45"/>' +
    '<polygon points="' + poly(user) + '" fill="rgba(31,75,63,.14)" stroke="#1f4b3f" stroke-width="1.8" stroke-linejoin="round"/>' +
    labels + '</svg>';
}

function reasonFor(d, userVal, city, i){
  const m = DIM_META[d], p = DIM_PHRASE[d];
  const mid = CITY_STATS.M[d];
  const you = userVal >= mid ? p.hi : p.lo;
  const gap = Math.abs(userVal - city.v[d]);
  if (Math.abs(userVal - mid) < 6) {
    const neutral = [
      '你在' + m.label + '上不太挑，' + city.name + '这一项也不会拖你后腿。',
      m.label + '对你不算关键，' + city.name + '在这一项上给得中规中矩。'
    ];
    return neutral[i % neutral.length];
  }
  if (gap > 12) {
    return '「' + m.label + '」这一项你们差得远：你要的是' + you + '，它偏另一头。';
  }
  const lines = [
    '你的' + m.label + '是「' + you + '」，' + city.name + '也是——这一项几乎不用妥协。',
    m.label + '上你们指向同一端：' + you + '，它正好也是。',
    '还有' + m.label + '——' + you + '，它也没跟你拧着来。'
  ];
  return lines[i % lines.length];
}

function renderResult(){
  const u = scoreUser();
  const ranked = CITIES.map(c => ({ c, m: matchScore(u, c) })).sort((a, b) => b.m - a.m);
  const top = ranked[0], alts = ranked.slice(1, 3);
  const pool = ranked.slice(3, 9).length ? ranked.slice(3, 9) : ranked.slice(-2);
  const worst = pool.map(x => {
    const g = DIMS.map(d => ({ d, gap: Math.abs(u[d] - x.c.v[d]) })).sort((a, b) => b.gap - a.gap)[0];
    return { city: x.c, m: x.m, dim: g.d, gap: g.gap };
  }).sort((a, b) => b.gap - a.gap)[0];

  const gaps = DIMS
    .map(d => ({ d, gap: Math.abs(u[d] - top.c.v[d]), flat: Math.abs(u[d] - CITY_STATS.M[d]) < 6 }))
    .sort((a, b) => (a.flat - b.flat) || (a.gap - b.gap));
  const fit = gaps.slice(0, 3);

  const whyHTML = fit.map((f, i) =>
    '<div>' + reasonFor(f.d, u[f.d], top.c, i) + '</div>'
  ).join('');

  const altHTML = alts.map(a =>
    '<div class="item"><b>' + a.c.name + '</b><span>' + a.c.tag + '</span><em>匹配度 ' + a.m + '%</em></div>'
  ).join('');

  const html =
    '<div class="rhead">' +
      '<div class="rlabel">你的城市匹配结果</div>' +
      '<div class="rcity">' + top.c.name + '</div>' +
      '<div class="rtag">' + top.c.tag + '</div>' +
      '<div class="rscore" style="margin-top:16px"><b>' + top.m + '</b><span>% 匹配度</span></div>' +
    '</div>' +

    '<div class="card"><h3>为什么是它</h3><div class="why">' + whyHTML + '</div>' +
      '<p style="font-size:14px;line-height:1.68;color:var(--muted);margin:16px 0 0">' + top.c.desc + '</p></div>' +

    '<div class="card"><h3>你的六维画像</h3>' +
      '<div class="radar">' + radarSVG(u, top.c) + '</div>' +
      '<p style="font-size:11.5px;color:var(--faint);margin:8px 0 0;text-align:center">实线是你，虚线是' + top.c.name + '</p></div>' +

    '<div class="card"><h3>备选两座</h3><div class="alt">' + altHTML + '</div>' +
      '<p style="font-size:13px;color:var(--muted);line-height:1.6;margin:14px 0 0">如果' + top.c.name + '在你这里不成立（成本、距离、家人），这两个是最接近的替代解。</p></div>' +

    '<div class="warn"><h3 style="font-size:13px;letter-spacing:.1em;font-weight:500;margin:0 0 14px">你最容易踩的坑</h3>' +
      '<p>' + worst.city.name + '，' + worst.m + '%。它离你不算远，但「' +
      DIM_META[worst.dim].label + '」这一项差得最远：你要的是' +
      (u[worst.dim] >= CITY_STATS.M[worst.dim] ? DIM_PHRASE[worst.dim].hi : DIM_PHRASE[worst.dim].lo) +
      '，它给不了。很多人搬过去住半年才承认这一点。</p></div>' +

    '<div class="card"><h3>30 天内可以做的三件事</h3><div class="acts">' +
      '<div>去' + top.c.name + '住三个工作日。<span style="color:var(--muted)">不是周末——周末的城市和工作的城市是两座城。</span></div>' +
      '<div>早八点坐一次当地地铁，晚十点走一段夜路。<span style="color:var(--muted)">这两件事比任何攻略都准。</span></div>' +
      '<div>按税后收入的 25% 算房租，在租房平台上看你能租到什么。<span style="color:var(--muted)">数字对不上，其它都是空谈。</span></div>' +
    '</div></div>' +

    '<div class="disc">本测试为趣味自测，基于 6 个主观维度与一组城市的定性画像做近似匹配，' +
      '不是科学测评，不构成搬迁、置业或职业决策建议。城市信息为一般性描述，实际情况以你亲自到访为准。<br>' +
      '全程不收集任何信息，所有计算都在你的设备上完成。</div>' +

    '<div class="ractions"><button id="btn-retry">再测一次</button>' +
      '<button class="solid" id="btn-copy">复制结果</button></div>';

  const s = $('s-result');
  s.innerHTML = html;
  show('s-result');

  $('btn-retry').onclick = () => { state.i = 0; state.answers.fill(null); show('s-start'); };

  $('btn-copy').onclick = async () => {
    const txt =
      '我的城市匹配结果：' + top.c.name + '（' + top.m + '%）\n' +
      '备选：' + alts.map(a => a.c.name).join(' / ') + '\n' +
      '最不合的：' + worst.c.name + '\n' +
      '—— 城市气质测试';
    try{
      await navigator.clipboard.writeText(txt);
      $('btn-copy').textContent = '已复制';
      setTimeout(() => { $('btn-copy').textContent = '复制结果'; }, 1600);
    }catch(e){
      $('btn-copy').textContent = '截图保存吧';
      setTimeout(() => { $('btn-copy').textContent = '复制结果'; }, 1600);
    }
  };
}
